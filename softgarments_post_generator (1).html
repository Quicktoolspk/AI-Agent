<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Softgarments Post Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #F4EDEA;
    padding: 30px;
    color: #4A2E33;
  }
  .app {
    max-width: 1300px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 30px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; color: #9B5765; }
  .sub { font-size: 13px; color: #9c7b80; margin-bottom: 20px; }

  .panel {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(155,87,101,0.08);
    height: fit-content;
  }

  label { display:block; font-size:12px; font-weight:600; color:#8A5A61; margin: 14px 0 5px; text-transform:uppercase; letter-spacing:0.5px;}
  label:first-of-type { margin-top:0; }
  input[type=text], textarea, select {
    width:100%; padding:9px 12px; border:1.5px solid #EBD6DA; border-radius:8px;
    font-size:14px; font-family:inherit; color:#4A2E33; background:#FFFBF9;
  }
  textarea { resize:vertical; min-height:60px; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:#C9A3A0; }

  .layout-picker { display:flex; gap:8px; margin-top:6px; }
  .layout-btn {
    flex:1; padding:10px 6px; border:1.5px solid #EBD6DA; border-radius:8px;
    background:#FFFBF9; font-size:12px; text-align:center; cursor:pointer; color:#8A5A61;
  }
  .layout-btn.active { border-color:#9B5765; background:#9B5765; color:#fff; font-weight:600; }

  .btn-download {
    width:100%; margin-top:22px; padding:13px; border:none; border-radius:8px;
    background:#9B5765; color:#FFF8F0; font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn-download:hover { background:#7d4652; }

  .preview-wrap { display:flex; align-items:flex-start; justify-content:center; }
  #canvas-scale { transform: scale(0.5); transform-origin: top center; }

  .stage {
    width:1080px; height:1080px; position:relative; overflow:hidden;
  }

  .heart-badge {
    width:150px; height:150px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 15px 40px rgba(155,87,101,0.18);
  }
  .heart-badge img { width:78px; height:78px; object-fit:contain; }

  .cta {
    display:inline-block; background:#9B5765; color:#FFF8F0; font-size:24px; font-weight:600;
    padding:20px 50px; border-radius:50px; letter-spacing:0.3px;
  }

  .watermark-icon {
    position:absolute; opacity:0.06; z-index:0; pointer-events:none;
  }
  .watermark-icon img { width:100%; height:100%; object-fit:contain; }

  /* LAYOUT 1: Minimal Centered */
  .l1 { background: linear-gradient(160deg,#FFF8F0 0%,#FCEEF1 45%,#F3DCE1 100%); text-align:center; }
  .l1 .blob { position:absolute; border-radius:50%; }
  .l1 .b1 { width:420px;height:420px; background:#D8A7B1; top:-140px; left:-140px; opacity:0.4;}
  .l1 .b2 { width:360px;height:360px; background:#C9A3A0; bottom:-120px; right:-120px; opacity:0.35;}
  .l1 .content { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px; }
  .l1 .eyebrow { font-size:19px; letter-spacing:6px; text-transform:uppercase; color:#C9A3A0; font-weight:600; margin:36px 0 22px; }
  .l1 .brand { font-family:Georgia,serif; font-size:64px; font-weight:700; color:#9B5765; margin-bottom:16px; }
  .l1 .headline { font-family:Georgia,serif; font-size:48px; font-weight:700; color:#6E3B45; line-height:1.3; margin-bottom:20px; }
  .l1 .tagline { font-size:22px; font-weight:300; color:#8A5A61; margin-bottom:44px; }
  .l1 .footer { position:absolute; bottom:50px; left:0; right:0; text-align:center; font-size:18px; letter-spacing:3px; color:#B98088; }

  /* LAYOUT 2: Badge Banner */
  .l2 { background:#FFF8F0; }
  .l2 .ribbon { background:#9B5765; color:#FFF8F0; text-align:center; padding:26px 0; font-size:22px; letter-spacing:4px; text-transform:uppercase; font-weight:600; position:relative; z-index:2; }
  .l2 .body { display:flex; flex-direction:column; align-items:center; justify-content:center; height:calc(100% - 90px); padding:60px 90px; text-align:center; position:relative;}
  .l2 .watermark-icon { width:480px; height:480px; top:50%; left:50%; transform:translate(-50%,-50%); }
  .l2 .brand { font-family:Georgia,serif; font-size:60px; font-weight:700; color:#9B5765; margin:30px 0 22px; position:relative; z-index:2;}
  .l2 .headline { font-family:Georgia,serif; font-size:42px; font-weight:700; color:#6E3B45; line-height:1.35; margin-bottom:18px; position:relative; z-index:2;}
  .l2 .tagline { font-size:21px; color:#8A5A61; margin-bottom:40px; position:relative; z-index:2; font-weight:300;}
  .l2 .footer { position:absolute; bottom:45px; left:0; right:0; text-align:center; font-size:17px; letter-spacing:3px; color:#B98088; z-index:2;}

  /* LAYOUT 4: Editorial */
  .l4 { background:#F8ECEA; border:2px solid #9B5765; box-sizing:border-box; position:relative; }
  .l4 .top-logo { position:absolute; top:56px; left:0; right:0; text-align:center; display:flex; align-items:center; justify-content:center; gap:10px; z-index:2; }
  .l4 .top-logo .icon-sm { width:34px; height:34px; }
  .l4 .top-logo .icon-sm img { width:100%; height:100%; object-fit:contain; }
  .l4 .top-logo span { font-family:Georgia,serif; font-size:26px; letter-spacing:4px; color:#6E3B45; font-weight:700; }
  .l4 .mid { position:absolute; top:44%; left:0; right:0; transform:translateY(-50%); text-align:center; padding:0 90px; z-index:2; }
  .l4 .eyebrow { font-size:17px; letter-spacing:6px; text-transform:uppercase; color:#9B5765; font-weight:700; margin-bottom:26px; }
  .l4 .headline { font-family:Georgia,serif; font-size:56px; font-weight:700; color:#4A2A31; line-height:1.35; margin-bottom:30px; }
  .l4 .divider { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:30px; }
  .l4 .divider .line { width:70px; height:1px; background:#C9A3A0; }
  .l4 .divider .icon-sm { width:26px; height:26px; }
  .l4 .divider .icon-sm img { width:100%; height:100%; object-fit:contain; }
  .l4 .tagline { font-size:20px; color:#8A5A61; font-weight:400; }
  .l4 .watermark-icon { width:500px; height:500px; bottom:60px; left:50%; transform:translateX(-50%); }
  .l4 .footer { position:absolute; bottom:56px; left:0; right:0; text-align:center; font-size:15px; letter-spacing:3px; color:#B98088; z-index:2; }

  /* upload input */
  .upload-box {
    border:1.5px dashed #C9A3A0; border-radius:8px; padding:16px; text-align:center;
    font-size:13px; color:#8A5A61; cursor:pointer; background:#FFFBF9;
  }
  .upload-box input { display:none; }
  .upload-preview { margin-top:8px; max-width:100%; border-radius:8px; display:none; }
  .upload-preview.show { display:block; }

  .product-img { object-fit:cover; width:100%; height:100%; display:block; }

  /* LAYOUT 5: Image right, text left */
  .l5 { background:#FFF8F0; display:flex; }
  .l5 .text-side { width:52%; display:flex; flex-direction:column; justify-content:center; padding:60px 60px; position:relative; }
  .l5 .img-side { width:48%; background:#F3DCE1; position:relative; overflow:hidden; }
  .l5 .eyebrow { font-size:16px; letter-spacing:5px; text-transform:uppercase; color:#9B5765; font-weight:700; margin-bottom:16px; }
  .l5 .brand { font-family:Georgia,serif; font-size:40px; font-weight:700; color:#6E3B45; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
  .l5 .brand .icon-sm { width:32px; height:32px; }
  .l5 .brand .icon-sm img { width:100%; height:100%; object-fit:contain; }
  .l5 .headline { font-family:Georgia,serif; font-size:36px; font-weight:700; color:#6E3B45; line-height:1.4; margin-bottom:16px; }
  .l5 .tagline { font-size:18px; color:#8A5A61; margin-bottom:30px; font-weight:400; }
  .l5 .footer { position:absolute; bottom:40px; left:60px; font-size:15px; letter-spacing:3px; color:#8A5A61; }

  /* LAYOUT 6: Full-bleed image background, text overlay */
  .l6 { position:relative; }
  .l6 .img-bg { position:absolute; inset:0; }
  .l6 .overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(74,42,49,0.05) 0%, rgba(74,42,49,0.75) 100%); }
  .l6 .content { position:absolute; bottom:0; left:0; right:0; z-index:2; padding:70px 80px; text-align:center; }
  .l6 .top-logo { position:absolute; top:50px; left:0; right:0; text-align:center; z-index:2; display:flex; align-items:center; justify-content:center; gap:10px; }
  .l6 .top-logo .icon-sm { width:36px; height:36px; }
  .l6 .top-logo .icon-sm img { width:100%; height:100%; object-fit:contain; filter:brightness(0) invert(1); }
  .l6 .top-logo span { font-family:Georgia,serif; font-size:26px; letter-spacing:4px; color:#FFF8F0; font-weight:700; }
  .l6 .eyebrow { font-size:17px; letter-spacing:5px; text-transform:uppercase; color:#F3DCE1; font-weight:700; margin-bottom:16px; }
  .l6 .headline { font-family:Georgia,serif; font-size:46px; font-weight:700; color:#FFF8F0; line-height:1.35; margin-bottom:16px; }
  .l6 .tagline { font-size:19px; color:#F3DCE1; margin-bottom:26px; font-weight:400; }
  .l6 .footer { font-size:15px; letter-spacing:3px; color:#F3DCE1; margin-top:10px; }

  /* LAYOUT 7: Image top half, text bottom half */
  .l7 { background:#FFF8F0; display:flex; flex-direction:column; }
  .l7 .img-top { width:100%; height:52%; position:relative; overflow:hidden; }
  .l7 .text-bottom { height:48%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 70px; position:relative; }
  .l7 .eyebrow { font-size:16px; letter-spacing:5px; text-transform:uppercase; color:#9B5765; font-weight:700; margin-bottom:14px; }
  .l7 .brand { font-family:Georgia,serif; font-size:34px; font-weight:700; color:#6E3B45; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .l7 .brand .icon-sm { width:28px; height:28px; }
  .l7 .brand .icon-sm img { width:100%; height:100%; object-fit:contain; }
  .l7 .headline { font-family:Georgia,serif; font-size:32px; font-weight:700; color:#6E3B45; line-height:1.35; margin-bottom:14px; }
  .l7 .tagline { font-size:17px; color:#8A5A61; margin-bottom:20px; font-weight:400; }
  .l7 .footer { position:absolute; bottom:24px; left:0; right:0; text-align:center; font-size:14px; letter-spacing:3px; color:#B98088; }

  /* LAYOUT 3: Split Emphasis */
  .l3 { background:#F3DCE1; display:flex; }
  .l3 .side { width:38%; background:#9B5765; display:flex; align-items:center; justify-content:center; }
  .l3 .side .icon-lg { width:120px; height:120px; }
  .l3 .side .icon-lg img { width:100%; height:100%; object-fit:contain; filter: brightness(0) invert(1); }
  .l3 .main { width:62%; display:flex; flex-direction:column; justify-content:center; padding:60px 70px; position:relative; z-index:2;}
  .l3 .watermark-icon { width:400px; height:400px; bottom:-60px; right:-60px; }
  .l3 .eyebrow { font-size:17px; letter-spacing:5px; text-transform:uppercase; color:#9B5765; font-weight:700; margin-bottom:18px; }
  .l3 .brand { font-family:Georgia,serif; font-size:52px; font-weight:700; color:#6E3B45; margin-bottom:20px; }
  .l3 .headline { font-family:Georgia,serif; font-size:38px; font-weight:700; color:#6E3B45; line-height:1.4; margin-bottom:18px; }
  .l3 .tagline { font-size:19px; color:#8A5A61; margin-bottom:36px; font-weight:400; }
  .l3 .footer { position:absolute; bottom:40px; left:38%; margin-left:70px; font-size:16px; letter-spacing:3px; color:#8A5A61; z-index:2;}
</style>
</head>

</div>

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  let productImgSrc = '';

  $('upload-box').addEventListener('click', () => $('upload-input').click());
  $('upload-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      productImgSrc = ev.target.result;
      const prev = $('upload-preview');
      prev.src = productImgSrc;
      prev.classList.add('show');
      $('upload-label').textContent = 'Image selected — click to change';
      render();
    };
    reader.readAsDataURL(file);
  });

  function render() {
    const eyebrow = $('eyebrow').value;
    const headline = $('headline').value;
    const tagline = $('tagline').value;
    const cta = $('cta').value;
    const footer = $('footer').value;

    const eyebrowEl = stage.querySelector('.eyebrow, .ribbon');
    if (eyebrowEl) eyebrowEl.textContent = eyebrow;

    const headlineEl = stage.querySelector('.headline');
    if (headlineEl) headlineEl.innerHTML = headline.split('\\n').join('<br>');

    const taglineEl = stage.querySelector('.tagline');
    if (taglineEl) taglineEl.textContent = tagline;

    const ctaEl = stage.querySelector('.cta');
    if (ctaEl) ctaEl.textContent = cta;

    const footerEl = stage.querySelector('.footer');
    if (footerEl) footerEl.textContent = footer;

    const prodImgEl = stage.querySelector('.product-img');
    if (prodImgEl && productImgSrc) prodImgEl.src = productImgSrc;
  }

  ['eyebrow','headline','tagline','cta','footer'].forEach(id => {
    $(id).addEventListener('input', render);
  });

  const layouts = {
    l1: `
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="content">
        <div class="heart-badge"><img src="${ICON_SRC}" /></div>
        <div class="eyebrow"></div>
        <div class="brand">Softgarments</div>
        <div class="headline"></div>
        <div class="tagline"></div>
        <div class="cta"></div>
      </div>
      <div class="footer"></div>
    `,
    l2: `
      <div class="ribbon"></div>
      <div class="body">
        <div class="watermark-icon"><img src="${ICON_SRC}" /></div>
        <div class="heart-badge" style="position:relative;z-index:2;"><img src="${ICON_SRC}" /></div>
        <div class="brand"></div>
        <div class="headline"></div>
        <div class="tagline"></div>
        <div class="cta"></div>
      </div>
      <div class="footer"></div>
    `,
    l3: `
      <div class="side"><div class="icon-lg"><img src="${ICON_SRC}" /></div></div>
      <div class="watermark-icon"><img src="${ICON_SRC}" /></div>
      <div class="main">
        <div class="eyebrow"></div>
        <div class="brand">Softgarments</div>
        <div class="headline"></div>
        <div class="tagline"></div>
        <div class="cta"></div>
      </div>
      <div class="footer"></div>
    `,
    l4: `
      <div class="top-logo">
        <div class="icon-sm"><img src="${ICON_SRC}" /></div>
        <span>SOFTGARMENTS</span>
      </div>
      <div class="watermark-icon"><img src="${ICON_SRC}" /></div>
      <div class="mid">
        <div class="eyebrow"></div>
        <div class="headline"></div>
        <div class="divider">
          <div class="line"></div>
          <div class="icon-sm"><img src="${ICON_SRC}" /></div>
          <div class="line"></div>
        </div>
        <div class="tagline"></div>
      </div>
      <div class="footer"></div>
    `,
    l5: `
      <div class="text-side">
        <div class="eyebrow"></div>
        <div class="brand"><div class="icon-sm"><img src="${ICON_SRC}" /></div>Softgarments</div>
        <div class="headline"></div>
        <div class="tagline"></div>
        <div class="cta"></div>
        <div class="footer"></div>
      </div>
      <div class="img-side"><img class="product-img" src="${ICON_SRC}" /></div>
    `,
    l6: `
      <div class="img-bg"><img class="product-img" src="${ICON_SRC}" /></div>
      <div class="overlay"></div>
      <div class="top-logo">
        <div class="icon-sm"><img src="${ICON_SRC}" /></div>
        <span>SOFTGARMENTS</span>
      </div>
      <div class="content">
        <div class="eyebrow"></div>
        <div class="headline"></div>
        <div class="tagline"></div>
        <div class="cta"></div>
        <div class="footer"></div>
      </div>
    `,
    l7: `
      <div class="img-top"><img class="product-img" src="${ICON_SRC}" /></div>
      <div class="text-bottom">
        <div class="eyebrow"></div>
        <div class="brand"><div class="icon-sm"><img src="${ICON_SRC}" /></div>Softgarments</div>
        <div class="headline"></div>
        <div class="tagline"></div>
        <div class="cta"></div>
        <div class="footer"></div>
      </div>
    `
  };

  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const layout = btn.dataset.layout;
      stage.className = 'stage ' + layout;
      stage.innerHTML = layouts[layout];
      render();
    });
  });

  $('download').addEventListener('click', () => {
    const scaleWrap = $('canvas-scale');
    scaleWrap.style.transform = 'scale(1)';
    html2canvas(stage, { width:1080, height:1080, scale:1 }).then(canvas => {
      scaleWrap.style.transform = 'scale(0.5)';
      const link = document.createElement('a');
      link.download = 'softgarments_post.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  stage.innerHTML = layouts.l1;
  render();
</script>
